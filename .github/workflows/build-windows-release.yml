name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to resolve; defaults to publish_tag or the event commit
        required: false
        type: string
      publish_tag:
        description: Existing GitHub Release tag to receive verified installers
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/build-windows-release.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "core/**"
      - "electron/**"
      - "resources/models/**"

permissions:
  contents: write

concurrency:
  group: build-windows-release-${{ inputs.publish_tag || inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ inputs.publish_tag == '' }}

jobs:
  windows:
    name: Windows x64 Full and Lite
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve frozen source and validate release target
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          DEFAULT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/release-preflight-smoke.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep the guard from this workflow revision when building an older tag.
          Copy-Item scripts/release-preflight.js "$env:RUNNER_TEMP/claracore-release-preflight.cjs"
          node "$env:RUNNER_TEMP/claracore-release-preflight.cjs" resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out resolved source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Verify checked-out source and package version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node "$env:RUNNER_TEMP/claracore-release-preflight.cjs" verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows dependencies
        run: npm ci

      - name: Run source checks
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:builtin-embedding
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:sqlite-vec:projection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Full installer
        run: npm run dist:win

      - name: Validate packaged Full built-in embedding
        run: npm run test:builtin-embedding:packaged

      - name: Build Windows Lite installer
        run: npm run dist:win:lite

      - name: Verify Full and Lite package boundaries
        run: npm run test:package:win:lite

      - name: Verify packaged SQLite vector runtime without UI
        run: |
          node scripts/verify-sqlite-vec-package.js "${{ github.workspace }}/dist/win-unpacked"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-sqlite-vec-package.js "${{ github.workspace }}/dist-lite/win-unpacked"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist, dist-lite -Filter '*-Setup.exe'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          # Keep the published manifest portable across PowerShell, sha256sum,
          # and macOS shasum by writing explicit LF line endings.
          $manifest = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS-windows.txt'),
            $manifest,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: claracore-desktop-windows-x64
          path: |
            dist/*-Setup.exe
            dist-lite/*-Setup.exe
            SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified Windows installers
        if: ${{ inputs.publish_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node "$env:RUNNER_TEMP/claracore-release-preflight.cjs" verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(
            Get-ChildItem dist, dist-lite -Filter '*-Setup.exe'
            Get-Item SHA256SUMS-windows.txt
          )
          $arguments = @('release', 'upload', $env:PUBLISH_TAG) + $files.FullName
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
