  <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 8px 0; border-top: 1px solid #e6e6ec; font-size: 12px; color: #6c6b78">
    <span style="display: flex; align-items: center; gap: 7px; color: #565562"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: 50%; background: #27705a"></span>本机服务运行中</span>
    <span>127.0.0.1:50668</span>
    <span>界面内容均为示例</span>
  </div>
</div>
  </div>
  <main style="flex: 999 1 560px; min-width: 0">
    <div style="max-width: 664px; margin: 0 auto; padding: 44px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 600">设置</h1>
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #565562">外观与启动</h2>
        <div style="border: 1px solid #e6e6ec; border-radius: 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px; border-bottom: 1px solid #e6e6ec">
            <span style="flex: 999 1 240px; min-width: 0; font-weight: 500">主题</span>
            <span role="radiogroup" aria-label="主题" style="display: inline-flex; border: 1px solid #cdcdd7; border-radius: 6px; overflow: hidden">
              <button type="button" role="radio" aria-checked="true" style="min-height: 30px; padding: 2px 10px; border: 0; border-right: 1px solid #cdcdd7; background: #e8e8ef; color: #25242c; font-size: 12.5px; font-weight: 550">跟随系统</button>
              <button type="button" role="radio" aria-checked="false" style="min-height: 30px; padding: 2px 10px; border: 0; border-right: 1px solid #cdcdd7; background: none; color: #565562; font-size: 12.5px">浅色</button>
              <button type="button" role="radio" aria-checked="false" style="min-height: 30px; padding: 2px 10px; border: 0; background: none; color: #565562; font-size: 12.5px">深色</button>
            </span>
          </div>
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px">
            <span style="flex: 999 1 240px; min-width: 0"><span style="display: block; font-weight: 500">登录时启动</span><span style="display: block; font-size: 12.5px; color: #6c6b78">智能体连接时需要 Desktop 保持运行。</span></span>
            <button type="button" role="switch" aria-checked="true" aria-label="登录时启动" style="position: relative; flex: none; width: 34px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: #6f54a3"><span aria-hidden="true" style="position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff"></span></button>
          </div>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #565562">记忆向量</h2>
        <div style="border: 1px solid #e6e6ec; border-radius: 8px">
          <label style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px">
            <span style="flex: 999 1 240px; min-width: 0"><span style="display: block; font-weight: 500">向量来源</span><span style="display: block; font-size: 12.5px; color: #6c6b78">选择外部接口时，记忆文本会发送给该接口。</span></span>
            <select style="height: 32px; padding: 0 6px; border: 1px solid #cdcdd7; border-radius: 6px; background: transparent; color: #25242c; font: inherit"><option>本机内置模型</option><option>Ollama</option><option>OpenAI 兼容接口</option><option>关闭</option></select>
          </label>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #565562">内在活动</h2>
        <div style="border: 1px solid #e6e6ec; border-radius: 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px">
            <span style="flex: 999 1 240px; min-width: 0"><span style="display: block; font-weight: 500">开启内在活动</span><span style="display: block; font-size: 12.5px; color: #6c6b78">生成内容不会自动成为已确认记忆。</span></span>
            <button type="button" role="switch" aria-checked="true" aria-label="开启内在活动" style="position: relative; flex: none; width: 34px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: #6f54a3"><span aria-hidden="true" style="position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff"></span></button>
          </div>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #565562">数据</h2>
        <div style="border: 1px solid #e6e6ec; border-radius: 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px; border-bottom: 1px solid #e6e6ec">
            <span style="flex: 999 1 240px; min-width: 0"><span style="display: block; font-weight: 500">数据位置</span><code style="display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #6c6b78; overflow-wrap: anywhere">~/Library/Application Support/claracore-desktop</code></span>
            <button type="button" style="min-height: 32px; padding: 2px 10px; border: 1px solid #cdcdd7; border-radius: 6px; background: none; color: #25242c; font-size: 12.5px">在访达中显示</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; padding: 11px 14px">
            <span style="flex: 999 1 240px; min-width: 0"><span style="display: block; font-weight: 500">备份</span><span style="display: block; font-size: 12.5px; color: #6c6b78">上次备份：今天 03:00。知识正文的恢复副本单独管理。</span></span>
            <button type="button" style="min-height: 32px; padding: 2px 10px; border: 1px solid #cdcdd7; border-radius: 6px; background: none; color: #25242c; font-size: 12.5px">立即备份</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
